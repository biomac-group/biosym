collocation:
  name: standing2d_dorschky
  description: >
    Single-node standing equilibrium for the dorschky_demo gait2d model.
    Produces a balanced upright posture that serves as the warm-start for
    the subsequent walking optimisation.

  settings:
    #model: dorschky_demo/models/gait2d.yaml
    model: dorschky_demo/models/gait2d.yaml
    nnodes: 1
    #enable_logging: true
    #iteration_log_interval: 1
    output:
      file: "dorschky_demo/result/standing2d.pkl"
    tol: 5e-4
    max_iter: 3000

  objectives:
    - name: effort_term
      weight: 1.0
      args:
        exponent: 2

  constraints:
    - name: dynamics
      weight: "1/BW"
    - name: ground_contact
      weight: "1/BW"
    - name: actuators
      weight: "1/BW"

  bounds:
    from_model: true
    start_at_origin: true
