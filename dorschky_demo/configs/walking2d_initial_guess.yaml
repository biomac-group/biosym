collocation:
  name: walking2d_initial_guess
  description: >
    100-node half-cycle walking solution for the dorschky_demo gait2d model.
    Tracks population-average joint angles from the biosym example data at
    1.3 m/s to produce a warm-start pickle used by the IMU tracking script.
    Solver settings (tolerances, discretisation) mirror track_imu2d.yaml.

  settings:
    #model: dorschky_demo/models/gait2d.yaml
    model: dorschky_demo/models/gait2d.yaml
    nnodes: 100
    enable_logging: true
    iteration_log_interval: 20
    discretization:
      type: euler
      args:
        mode: backward
        vars: q
        weight: 10
        adaptive_h: false
    output:
      file: "dorschky_demo/result/walking2d.pkl"
    tol: 5e-4
    acceptable_tol: 1e-3
    acceptable_dual_inf_tol: 1e-3
    constr_viol_tol: 1e-4
    max_iter: 400

  objectives:
    - name: track_angles
      weight: 0.1
      args:
        presegmented: true
        presegmented_file: "example_data/gait_avg_joint_angles.mot"
        exclude:
          - pelvis_tx
          - pelvis_ty

    - name: effort_term
      weight: 150
      args:
        exponent: 2
        speedweighting: true

    #- name: track_grf
    #  weight: 0.2
    #  args:
    #    presegmented: true
    #    presegmented_file: "example_data/gait_avg_grf.mot"

  constraints:
    - name: dynamics
      weight: "1/BW"
    - name: ground_contact
      weight: "1/BW"
    - name: actuators
      weight: "1/BW"
    - name: periodicity
      weight: 0.001
      args:
        symmetry: true

  initial_guess:
    type: from_file
    file: "dorschky_demo/result/standing2d.pkl"

  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.35, 0.85]
    speed: 1.3
