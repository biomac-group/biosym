collocation:
  name: walking2d_initial_guess
  description: >
    100-node half-cycle walking solution that tracks population-average
    joint angles (excluding the ankle) to produce a well-conditioned
    initial guess for further gait optimization.
  settings:
    model: tests/models/gait2d_huntcrossley/gait2d_huntcrossley.yaml
    nnodes: 100
    discretization:
      type: euler
      args:
        mode: backward
        vars: q
        weight: 1
        adaptive_h: false
    output:
      file: "~/.biosym/walking2d_initial_guess.pkl"
    tol: 5e-4
    acceptable_dual_inf_tol: 1e-3
    constr_viol_tol: 1e-4
    max_iter: 4000
    logging_interval: 20
    enable_logging: true

  objectives:
    - name: track_angles
      weight: 1
      args:
        presegmented: true
        presegmented_file: "example_data/gait_avg_joint_angles.mot"
        exclude:
          - pelvis_tx
          - pelvis_ty

    - name: effort_term
      weight: 1000
      args:
        exponent: 3
        speedweighting: true
      
    - name: track_grf
      weight: 1
      args:
        presegmented: true
        presegmented_file: "example_data/gait_avg_grf.mot"

  constraints:
    - name: dynamics
    - name: periodicity
      args:
        symmetry: false
        exclude: [0] # Exclude pelvis_tx: it must accumulate forward progress

  initial_guess: # <-- We use the previous standing solution as initial guess
    type: from_file
    file: "~/.biosym/standing2d.pkl"

  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.5, 1.3]
    speed: 1.3
